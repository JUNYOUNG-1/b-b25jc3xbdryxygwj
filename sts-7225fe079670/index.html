<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>과학기술과 사회</title>
<style>
:root{--bg:#F6F4EF;--ink:#1D1F24;--muted:#5F6470;--line:#DEDAD0;--surface:#fff;--accent:#284B8C;--bad:#C62A2A}
@media(prefers-color-scheme:dark){:root{--bg:#14161A;--ink:#E7E9EE;--muted:#9EA4B0;--line:#2F333C;--surface:#1C1F25;--accent:#8FB0F0;--bad:#FF7B72}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
form{width:100%;max-width:22rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.4rem}
h1{font-size:1.15rem;margin:0 0 .3rem}p{margin:.2rem 0 1rem;color:var(--muted);font-size:.9rem}
input[type=password]{width:100%;font-size:1rem;padding:.65rem .75rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
label{display:flex;gap:.45rem;align-items:center;margin:.7rem 0;font-size:.88rem;color:var(--muted)}
button{width:100%;font-size:1rem;padding:.7rem;border:0;border-radius:6px;background:var(--accent);color:#fff;font-weight:700}
#msg{color:var(--bad);font-size:.88rem;min-height:1.3em;margin:.5rem 0 0}
</style></head><body>
<form id="f"><h1>과학기술과 사회 공부자료</h1><p>비밀번호를 입력하세요.</p>
<input id="pw" type="password" autocomplete="current-password" autofocus>
<label><input id="rm" type="checkbox"> 이 기기에서 기억하기</label>
<button type="submit">열기</button><div id="msg"></div></form>
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw,quiet){
  const msg=document.getElementById('msg');msg.textContent=quiet?'':'여는 중…';
  try{
    const o=await (await fetch('data.txt',{cache:'no-store'})).json();
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(o.s),iterations:o.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const gz=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(o.v)},key,b64(o.c)));
    const st=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(st).text();
    document.open();document.write(html);document.close();
    return true;
  }catch(e){msg.textContent=quiet?'':'비밀번호가 맞지 않거나 불러오지 못했습니다.';return false}
}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();
  const pw=document.getElementById('pw').value;
  if(await open_(pw,false)&&document.getElementById('rm').checked){try{localStorage.setItem('stsp',pw)}catch(x){}}});
try{const k=localStorage.getItem('stsp');if(k)open_(k,true).then(ok=>{if(!ok)try{localStorage.removeItem('stsp')}catch(x){}})}catch(x){}
</script></body></html>
